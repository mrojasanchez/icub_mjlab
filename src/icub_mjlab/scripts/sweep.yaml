program: icub_mjlab.scripts.train
method: bayes  # o 'random' para búsqueda aleatoria
metric:
  name: Metrics/lift_height/episode_success
  goal: maximize

# Hiperparámetros a explorar y fijos
parameters:
  preset:
    value: maximum
  schedule:
    value: fixed
  max-iterations:
    value: 4000
  save-interval:
    value: 500
  # Exploración continua de Learning Rate (escala logarítmica)
  learning-rate:
    distribution: log_uniform_values
    min: 1.5e-4
    max: 6.0e-4

  # Exploración continua de pesos de recompensa
  reward-goal-weight:
    distribution: uniform
    min: 2.0
    max: 6.0

  reward-lift-weight:
    distribution: uniform
    min: 1.5
    max: 4.5


# Comando que ejecutará el agente con video activado
command:
  - uv
  - run
  - train-icub
  - --video
  - --video-interval-iter
  - 1000
  - --video-length
  - 500
  - ${args}