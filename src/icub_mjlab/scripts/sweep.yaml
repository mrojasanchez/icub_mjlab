program: icub_mjlab.scripts.train
method: grid
metric:
  name: Metrics/lift_height/episode_success
  goal: maximize

# Hiperparámetros fijos y barrido de 4 valores de learning rate (Punto 1)
parameters:
  preset:
    value: maximum
  schedule:
    value: fixed
  num-learning-epochs:
    value: 3
  max-iterations:
    value: 4000
  save-interval:
    value: 4000
  learning-rate:
    values:
      - 0.0001   # 1.0e-4 (conservador / alta estabilidad)
      - 0.0002   # 2.0e-4 (equilibrio estabilidad-velocidad)
      - 0.0003   # 3.0e-4 (nominal del paper DextrAH-RGB)
      - 0.0005   # 5.0e-4 (convergencia rápida)

# Comando que ejecuta el agente con video y modelo solo al final del entrenamiento
command:
  - uv
  - run
  - train-icub
  - --video
  - --video-only-final
  - --upload-only-final
  - --video-length
  - 500
  - ${args}