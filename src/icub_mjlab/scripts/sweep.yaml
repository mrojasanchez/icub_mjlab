program: icub_mjlab.scripts.train
method: bayes  # o 'random' para búsqueda aleatoria
metric:
  name: Metrics/lift_height/episode_success
  goal: maximize

# Hiperparámetros a explorar y fijos
parameters:
  preset:
    value: maximum
  schedule:
    value: fixed
  max-iterations:
    value: 4000
  save-interval:
    value: 500
  learning-rate:
    values: [2.0e-4, 3.0e-4, 5.0e-4]
  reward-goal-weight:
    values: [2.0, 3.5, 5.0]
  reward-lift-weight:
    values: [1.5, 2.5, 4.0]
  reward-action-rate-weight:
    values: [-0.012, -0.015, -0.02]

# Comando que ejecutará el agente con video activado
command:
  - uv
  - run
  - train-icub
  - --video
  - --video-interval-iter
  - 1000
  - --video-length
  - 500
  - ${args}